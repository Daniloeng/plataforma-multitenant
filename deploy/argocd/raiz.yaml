# App of apps: o Argo CD lê deploy/argocd/apps na main e cria cada Application de lá.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: raiz
  namespace: argocd
spec:
  project: plataforma
  source:
    repoURL: https://github.com/Daniloeng/plataforma-multitenant.git
    targetRevision: main
    path: deploy/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }

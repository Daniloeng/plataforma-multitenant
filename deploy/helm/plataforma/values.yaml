# Valores padrão do chart (ADR-0016). Os nomes dos serviços e as portas são os mesmos do Compose,
# para os serviços se acharem pelo DNS do Kubernetes como se acham no Compose.

image:
  # Imagens publicadas pelo workflow de release (ghcr.io/daniloeng/plataforma-<serviço>:<versão>).
  registry: ghcr.io/daniloeng
  prefix: plataforma-
  # Vazio: usa o appVersion do chart.
  tag: ""
  pullPolicy: IfNotPresent

# Onde o frontend e o curl pegam o token: o emissor (iss) precisa ser o mesmo endereço que o
# navegador usa para falar com o Keycloak (ADR-0009). No kind, é o port-forward em localhost:8180.
keycloak:
  enabled: true
  image: keycloak/keycloak:26.4.7
  hostname: http://localhost:8180
  # Senha do admin do console. Vazia: gerada na instalação e guardada no Secret keycloak-admin
  # (mantida nas atualizações). Para usar um Secret próprio, com a chave "senha": existingSecret.
  adminPassword: ""
  existingSecret: ""
  # Só modo dev (start-dev, sem TLS, usuários de demonstração): não exponha por Ingress (ADR-0016).
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 768Mi }

pulsar:
  image: apachepulsar/pulsar:4.0.7
  initImage: curlimages/curl:8.11.1
  mem: "-Xms256m -Xmx512m -XX:MaxDirectMemorySize=256m"
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests: { cpu: 200m, memory: 768Mi }
    limits: { memory: 1280Mi }

mongo:
  image: mongo:8.0
  # Um MongoDB por serviço (regra do projeto), cada um replica set de um nó (transações).
  databases: [tenants, catalogo, pedidos, pagamentos]
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

# Serviços de negócio. `mongo` é a database dele; `replicas` é o mínimo (o KEDA pode subir mais).
services:
  tenant-service:
    port: 8081
    mongo: tenants
    replicas: 1
  catalogo-service:
    port: 8082
    mongo: catalogo
    replicas: 1
  # Duas réplicas: o lease do relay do outbox (ADR-0015) deixa só uma publicar.
  pedidos-service:
    port: 8083
    mongo: pedidos
    replicas: 2
  pagamentos-service:
    port: 8084
    mongo: pagamentos
    replicas: 1
    env:
      # Escala pelo backlog (KEDA): fila pequena deixa o backlog no broker para as réplicas novas.
      PLATAFORMA_EVENTS_RECEIVERQUEUESIZE: "20"

serviceResources:
  requests: { cpu: 100m, memory: 384Mi }
  limits: { memory: 512Mi }

# Uma réplica só: o rate limit por plano é em memória e se multiplicaria com mais réplicas.
gateway:
  port: 8000
  managementPort: 8001
  service:
    type: ClusterIP
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 384Mi }

statusService:
  port: 8090
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 384Mi }

# Fronteira de rede (ADR-0016): no Compose, os serviços só eram alcançáveis pela rede interna. Aqui,
# sem isto, qualquer pod do cluster chamaria um serviço com X-Tenant-Id e X-Papeis forjados ou leria
# o MongoDB de outro serviço.
networkPolicy:
  enabled: true
  # Namespaces que leem o admin do Pulsar (o operador do KEDA).
  pulsarAdminNamespaces: [keda]

tracing:
  # Liga a exportação OTLP quando houver um coletor (Tempo) no cluster.
  export: false
  endpoint: http://tempo:4318/v1/traces

# Escala o pagamentos-service pelo backlog do pedido.criado no Pulsar (precisa do KEDA instalado).
keda:
  enabled: false
  service: pagamentos-service
  minReplicas: 1
  maxReplicas: 3
  topic: persistent://plataforma/pedidos/pedido.criado.v1
  subscription: pagamentos-service-pedido-criado
  # Mensagens pendentes por réplica antes de subir mais uma.
  backlogThreshold: 20
  pollingInterval: 15
  cooldownPeriod: 120

# Porta de entrada (8000) e Actuator só interno (8001), como no Compose (ADR-0015).
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    {{- include "plataforma.labels" . | nindent 4 }}
    app.kubernetes.io/name: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - { name: http, port: {{ .Values.gateway.port }} }
---
# Actuator do gateway num Service à parte e sempre interno: as métricas têm nomes de tenants, e a
# porta pública pode virar LoadBalancer.
apiVersion: v1
kind: Service
metadata:
  name: gateway-management
  labels:
    {{- include "plataforma.labels" . | nindent 4 }}
    app.kubernetes.io/name: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - { name: management, port: {{ .Values.gateway.managementPort }} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    {{- include "plataforma.labels" . | nindent 4 }}
    app.kubernetes.io/name: gateway
spec:
  # Uma só: o rate limit por plano é em memória (ver values.yaml).
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        {{- include "plataforma.labels" . | nindent 8 }}
        app.kubernetes.io/name: gateway
        app.kubernetes.io/component: edge
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.gateway.managementPort | quote }}
        prometheus.io/path: /actuator/prometheus
    spec:
      terminationGracePeriodSeconds: 30
      {{- include "plataforma.podSecurity" . | nindent 6 }}
      initContainers:
        {{- include "plataforma.waitFor" (list . "" "tenants") | nindent 8 }}
      containers:
        - name: gateway
          image: {{ include "plataforma.image" (list . "gateway") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: {{ .Values.gateway.port }} }
            - { name: management, containerPort: {{ .Values.gateway.managementPort }} }
          env:
            - { name: MANAGEMENT_PORT, value: {{ .Values.gateway.managementPort | quote }} }
            - { name: KEYCLOAK_ISSUER, value: {{ printf "%s/realms/plataforma" .Values.keycloak.hostname | quote }} }
            - { name: KEYCLOAK_JWKS, value: "http://keycloak:8080/realms/plataforma/protocol/openid-connect/certs" }
            - { name: STATUS_SERVICE_URL, value: "http://status-service:{{ .Values.statusService.port }}" }
            {{- range $name, $svc := .Values.services }}
            - name: {{ $name | upper | replace "-" "_" }}_URL
              value: "http://{{ $name }}:{{ $svc.port }}"
            {{- end }}
            {{- include "plataforma.commonEnv" . | nindent 12 }}
          {{- include "plataforma.probes" "management" | nindent 10 }}
          {{- include "plataforma.containerSecurity" . | nindent 10 }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        {{- include "plataforma.tmpVolume" . | nindent 8 }}

openapi: 3.1.0
info:
  title: Pedidos
  version: 1.0.0
  description: >-
    Ciclo de vida do pedido. Um pedido nasce PENDENTE e muda de estado pelos eventos
    de pagamento (saga coreografada). O preço de cada item vem da cópia local do catálogo
    (eventos produto.alterado e preco.alterado), nunca do cliente: o corpo só traz produto e
    quantidade.
servers:
  - url: http://localhost:8083
security:
  - jwt: []
x-autorizacao: "Papel comprador (cria e cancela os próprios pedidos) ou gestor-tenant (lê todos)."
tags:
  - name: pedidos
paths:
  /api/v1/pedidos:
    parameters:
      - $ref: '_comum.yaml#/components/parameters/TenantId'
    post:
      tags: [pedidos]
      operationId: criarPedido
      summary: Cria um pedido PENDENTE e publica pedido.criado (via outbox)
      parameters:
        - $ref: '_comum.yaml#/components/parameters/ClienteId'
        - $ref: '_comum.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovoPedido' }
      description: >-
        Só compradores (com cliente no token); tenant suspenso responde 403 `tenant-suspenso`. Repetir com a mesma Idempotency-Key e o mesmo corpo
        devolve o pedido já criado (200, cabeçalho Idempotent-Replayed: true); a mesma chave com
        outro corpo responde 409 `chave-reutilizada`. Produto inexistente, inativo ou ainda sem preço na cópia
        local do catálogo responde 409 `produto-indisponivel`, com os ids na propriedade `produtos`.
      responses:
        '200':
          description: Repetição de uma criação já feita com a mesma chave.
          headers:
            Idempotent-Replayed:
              description: Sempre "true" na repetição.
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '201':
          description: Pedido criado.
          headers:
            Location:
              description: Caminho do pedido criado (/api/v1/pedidos/{id}).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '400': { $ref: '_comum.yaml#/components/responses/RequisicaoInvalida' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '409': { $ref: '_comum.yaml#/components/responses/Conflito' }
        '429': { $ref: '_comum.yaml#/components/responses/LimiteExcedido' }
        '503': { $ref: '#/components/responses/Indisponivel' }
    get:
      tags: [pedidos]
      operationId: listarPedidos
      description: Comprador vê só os pedidos do próprio cliente; gestor-tenant vê todos.
      parameters:
        - $ref: '_comum.yaml#/components/parameters/ClienteIdOpcional'
        - $ref: '_comum.yaml#/components/parameters/Cursor'
        - $ref: '_comum.yaml#/components/parameters/Limite'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/StatusPedido' }
      responses:
        '200':
          description: Página de pedidos, do mais recente para o mais antigo.
          content:
            application/json:
              schema:
                type: object
                required: [itens]
                properties:
                  itens:
                    type: array
                    items: { $ref: '#/components/schemas/Pedido' }
                  proximoCursor: { type: [string, 'null'] }
        '400': { $ref: '_comum.yaml#/components/responses/RequisicaoInvalida' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '503': { $ref: '_comum.yaml#/components/responses/TenantEmMigracao' }
  /api/v1/isolamento/pedidos:
    parameters:
      - $ref: '_comum.yaml#/components/parameters/TenantId'
    get:
      tags: [isolamento]
      operationId: isolamentoDosPedidos
      parameters:
        - $ref: '_comum.yaml#/components/parameters/ClienteIdOpcional'
      summary: Onde o pedidos-service guarda os dados do tenant (nível, database e migração)
      description: >-
        Só gestor-tenant e plataforma-admin (comprador: 403). POOL usa a database compartilhada
        `pedidos`; BRIDGE e SILO, a database dedicada `pedidos_t_<tenant>` (ADR-0014). Durante a
        migração, esta rota continua respondendo, com `situacao` MIGRANDO, enquanto as demais APIs
        do tenant respondem 503 `tenant-em-migracao`.
      responses:
        '200':
          description: Posição dos dados do tenant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Isolamento' }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /api/v1/pedidos/{pedidoId}:
    parameters:
      - $ref: '_comum.yaml#/components/parameters/TenantId'
      - name: pedidoId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [pedidos]
      operationId: obterPedido
      description: Pedido de outro cliente responde 404 para o comprador.
      parameters:
        - $ref: '_comum.yaml#/components/parameters/ClienteIdOpcional'
      responses:
        '200':
          description: Pedido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '503': { $ref: '_comum.yaml#/components/responses/TenantEmMigracao' }
        '404': { $ref: '_comum.yaml#/components/responses/NaoEncontrado' }
  /api/v1/pedidos/{pedidoId}/linha-do-tempo:
    parameters:
      - $ref: '_comum.yaml#/components/parameters/TenantId'
      - name: pedidoId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [pedidos]
      operationId: acompanharPedido
      summary: Linha do tempo do pedido em tempo real (Server-Sent Events)
      description: >-
        Mantém a conexão aberta e envia o evento `pedido` (dados: o Pedido em JSON, com o
        `historico`) ao conectar e a cada mudança do pedido, até `timeout` (padrão 5 minutos). A
        cada 15 s chega um comentário `: ping` para manter a conexão viva. O cliente reconecta
        quando quiser; o primeiro evento sempre traz o estado atual, então nenhuma mudança se perde.
        Mesmas regras de acesso do GET do pedido (pedido de outro cliente: 404). Usa
        `text/event-stream` com `fetch` (o EventSource do navegador não envia o Authorization).
      parameters:
        - $ref: '_comum.yaml#/components/parameters/ClienteIdOpcional'
      responses:
        '200':
          description: >-
            Fluxo SSE. Cada mensagem tem `event: pedido`, `id:` com a versão do pedido e `data:`
            com o Pedido em JSON numa linha.
          content:
            text/event-stream:
              schema: { type: string }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '503': { $ref: '_comum.yaml#/components/responses/TenantEmMigracao' }
        '404': { $ref: '_comum.yaml#/components/responses/NaoEncontrado' }
  /api/v1/pedidos/{pedidoId}/cancelamento:
    parameters:
      - $ref: '_comum.yaml#/components/parameters/TenantId'
      - name: pedidoId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [pedidos]
      operationId: cancelarPedido
      summary: Cancela o pedido e publica pedido.cancelado (gera estorno se já capturado)
      description: >-
        Comprador cancela pedido do próprio cliente (o de outro cliente responde 404); gestor-tenant
        cancela qualquer pedido do tenant (plataforma-admin também). O motivo registra quem cancelou:
        SOLICITADO_PELO_CLIENTE ou CANCELADO_PELO_TENANT. Pedido já cancelado responde 409
        `pedido-ja-cancelado`; quem repete um cancelamento pode tratar esse 409 como sucesso.
      parameters:
        - $ref: '_comum.yaml#/components/parameters/ClienteIdOpcional'
      responses:
        '200':
          description: Pedido cancelado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '503': { $ref: '_comum.yaml#/components/responses/TenantEmMigracao' }
        '404': { $ref: '_comum.yaml#/components/responses/NaoEncontrado' }
        '409': { $ref: '_comum.yaml#/components/responses/Conflito' }
components:
  securitySchemes:
    jwt:
      $ref: '_comum.yaml#/components/securitySchemes/jwt'
  responses:
    Indisponivel:
      description: >-
        O banco de dados não respondeu (`indisponivel`) ou os dados do tenant estão migrando de nível
        (`tenant-em-migracao`, com Retry-After); tente de novo em instantes.
      content:
        application/problem+json:
          schema: { $ref: '_comum.yaml#/components/schemas/Problema' }
    SemPermissao:
      description: O papel do usuário não permite a operação.
      content:
        application/problem+json:
          schema: { $ref: '_comum.yaml#/components/schemas/Problema' }
  schemas:
    MotivoCancelamento:
      type: string
      enum: [PAGAMENTO_RECUSADO, SOLICITADO_PELO_CLIENTE, EXPIRADO, OUTRO, CANCELADO_PELO_TENANT]
    StatusPedido:
      type: string
      enum: [PENDENTE, CONFIRMADO, CANCELADO]
    ItemPedido:
      type: object
      required: [produtoId, quantidade]
      properties:
        produtoId: { type: string }
        sku: { type: string, readOnly: true }
        nome: { type: string, readOnly: true, description: Nome do produto no momento do pedido. }
        quantidade: { type: integer, minimum: 1, maximum: 10000 }
        precoUnitario:
          $ref: '_comum.yaml#/components/schemas/Dinheiro'
          readOnly: true
    NovoPedido:
      type: object
      required: [itens]
      properties:
        itens:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/ItemPedido' }
    Isolamento:
      type: object
      required: [tenantId, nivel, database, situacao]
      properties:
        tenantId: { type: string }
        nivel: { type: string, enum: [POOL, BRIDGE, SILO] }
        database:
          type: string
          description: Database MongoDB onde ficam os pedidos do tenant.
        situacao:
          type: string
          enum: [PRONTO, MIGRANDO]
        migradoEm:
          type: [string, 'null']
          format: date-time
          description: Quando a última migração de nível terminou (null se o tenant nunca migrou).
    TipoMarco:
      type: string
      description: >-
        CRIADO (pedido.criado), PAGO (pagamento.aprovado confirmou o pedido), RECUSADO
        (pagamento.recusado), CANCELADO (pedido.cancelado, com o motivo), ESTORNADO
        (pagamento.estornado devolveu o valor).
      enum: [CRIADO, PAGO, RECUSADO, CANCELADO, ESTORNADO]
    MarcoPedido:
      type: object
      required: [tipo, em]
      properties:
        tipo: { $ref: '#/components/schemas/TipoMarco' }
        em: { type: string, format: date-time }
        detalhe:
          type: [string, 'null']
          description: >-
            PAGO e ESTORNADO: id do pagamento. RECUSADO: motivo do gateway. CANCELADO: o
            MotivoCancelamento.
    Pedido:
      type: object
      required: [id, clienteId, status, itens, total, criadoEm]
      properties:
        id: { type: string }
        clienteId: { type: string }
        status: { $ref: '#/components/schemas/StatusPedido' }
        itens:
          type: array
          items: { $ref: '#/components/schemas/ItemPedido' }
        total: { $ref: '_comum.yaml#/components/schemas/Dinheiro' }
        pagamentoId:
          type: [string, 'null']
          description: Pagamento que confirmou o pedido (pagamento.aprovado).
        motivoCancelamento:
          oneOf:
            - $ref: '#/components/schemas/MotivoCancelamento'
            - type: 'null'
        criadoEm: { type: string, format: date-time }
        atualizadoEm: { type: string, format: date-time }
        historico:
          type: array
          description: >-
            Marcos da saga, do mais antigo ao mais recente. Pedidos anteriores ao Dia 8 recebem um
            histórico reconstruído a partir do status.
          items: { $ref: '#/components/schemas/MarcoPedido' }

openapi: 3.1.0
info:
  title: Pedidos
  version: 1.0.0
  description: >-
    Ciclo de vida do pedido. Um pedido nasce PENDENTE e muda de estado pelos eventos
    de pagamento (saga coreografada).
servers:
  - url: http://localhost:8083
security:
  - jwt: []
x-autorizacao: "Papel comprador (cria e cancela os próprios pedidos) ou gestor-tenant (lê todos)."
tags:
  - name: pedidos
paths:
  /api/v1/pedidos:
    parameters:
      - $ref: '_comum.yaml#/components/parameters/TenantId'
    post:
      tags: [pedidos]
      operationId: criarPedido
      summary: Cria um pedido PENDENTE e publica pedido.criado (via outbox)
      parameters:
        - $ref: '_comum.yaml#/components/parameters/ClienteId'
        - $ref: '_comum.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovoPedido' }
      responses:
        '201':
          description: Pedido criado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '400': { $ref: '_comum.yaml#/components/responses/RequisicaoInvalida' }
        '409': { $ref: '_comum.yaml#/components/responses/Conflito' }
        '429': { $ref: '_comum.yaml#/components/responses/LimiteExcedido' }
    get:
      tags: [pedidos]
      operationId: listarPedidos
      description: Comprador vê só os pedidos do próprio cliente; gestor-tenant vê todos.
      parameters:
        - $ref: '_comum.yaml#/components/parameters/ClienteIdOpcional'
        - $ref: '_comum.yaml#/components/parameters/Cursor'
        - $ref: '_comum.yaml#/components/parameters/Limite'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/StatusPedido' }
      responses:
        '200':
          description: Página de pedidos, do mais recente para o mais antigo.
          content:
            application/json:
              schema:
                type: object
                required: [itens]
                properties:
                  itens:
                    type: array
                    items: { $ref: '#/components/schemas/Pedido' }
                  proximoCursor: { type: [string, 'null'] }
  /api/v1/pedidos/{pedidoId}:
    parameters:
      - $ref: '_comum.yaml#/components/parameters/TenantId'
      - name: pedidoId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [pedidos]
      operationId: obterPedido
      description: Pedido de outro cliente responde 404 para o comprador.
      parameters:
        - $ref: '_comum.yaml#/components/parameters/ClienteIdOpcional'
      responses:
        '200':
          description: Pedido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '404': { $ref: '_comum.yaml#/components/responses/NaoEncontrado' }
  /api/v1/pedidos/{pedidoId}/cancelamento:
    parameters:
      - $ref: '_comum.yaml#/components/parameters/TenantId'
      - name: pedidoId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [pedidos]
      operationId: cancelarPedido
      summary: Cancela o pedido e publica pedido.cancelado (gera estorno se já capturado)
      description: Comprador só cancela pedido do próprio cliente; o de outro cliente responde 404.
      parameters:
        - $ref: '_comum.yaml#/components/parameters/ClienteIdOpcional'
      responses:
        '200':
          description: Pedido cancelado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '404': { $ref: '_comum.yaml#/components/responses/NaoEncontrado' }
        '409': { $ref: '_comum.yaml#/components/responses/Conflito' }
components:
  securitySchemes:
    jwt:
      $ref: '_comum.yaml#/components/securitySchemes/jwt'
  schemas:
    StatusPedido:
      type: string
      enum: [PENDENTE, CONFIRMADO, CANCELADO]
    ItemPedido:
      type: object
      required: [produtoId, quantidade]
      properties:
        produtoId: { type: string }
        sku: { type: string, readOnly: true }
        quantidade: { type: integer, minimum: 1, maximum: 10000 }
        precoUnitario:
          $ref: '_comum.yaml#/components/schemas/Dinheiro'
          readOnly: true
    NovoPedido:
      type: object
      required: [itens]
      properties:
        itens:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/ItemPedido' }
    Pedido:
      type: object
      required: [id, clienteId, status, itens, total, criadoEm]
      properties:
        id: { type: string }
        clienteId: { type: string }
        status: { $ref: '#/components/schemas/StatusPedido' }
        itens:
          type: array
          items: { $ref: '#/components/schemas/ItemPedido' }
        total: { $ref: '_comum.yaml#/components/schemas/Dinheiro' }
        criadoEm: { type: string, format: date-time }
        atualizadoEm: { type: string, format: date-time }

openapi: 3.1.0
info:
  title: Pagamentos
  version: 1.0.0
  description: >-
    Consulta de pagamentos e do ledger (partidas dobradas) do tenant. A autorização e a captura
    acontecem de forma assíncrona, a partir de pedido.criado, num gateway de pagamento simulado
    (aprova até um limite de valor e recusa acima dele); não há POST de pagamento na API. Um
    pedido é cobrado no máximo uma vez; cancelado depois da captura, é estornado (ADR-0012).
servers:
  - url: http://localhost:8084
security:
  - jwt: []
x-autorizacao: "Papel gestor-tenant ou plataforma-admin; os demais recebem 403."
tags:
  - name: pagamentos
  - name: ledger
paths:
  /api/v1/pagamentos:
    parameters:
      - $ref: '_comum.yaml#/components/parameters/TenantId'
    get:
      tags: [pagamentos]
      operationId: listarPagamentos
      parameters:
        - $ref: '_comum.yaml#/components/parameters/Cursor'
        - $ref: '_comum.yaml#/components/parameters/Limite'
        - name: pedidoId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/StatusPagamento' }
      responses:
        '200':
          description: Página de pagamentos.
          content:
            application/json:
              schema:
                type: object
                required: [itens]
                properties:
                  itens:
                    type: array
                    description: Do mais recente para o mais antigo.
                    items: { $ref: '#/components/schemas/Pagamento' }
                  proximoCursor: { type: [string, 'null'] }
        '400': { $ref: '_comum.yaml#/components/responses/RequisicaoInvalida' }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /api/v1/pagamentos/{pagamentoId}:
    parameters:
      - $ref: '_comum.yaml#/components/parameters/TenantId'
      - name: pagamentoId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [pagamentos]
      operationId: obterPagamento
      responses:
        '200':
          description: Pagamento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pagamento' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '_comum.yaml#/components/responses/NaoEncontrado' }
  /api/v1/ledger/lancamentos:
    parameters:
      - $ref: '_comum.yaml#/components/parameters/TenantId'
    get:
      tags: [ledger]
      operationId: listarLancamentos
      summary: Extrato do ledger do tenant (lançamentos imutáveis)
      description: >-
        Do lançamento mais recente para o mais antigo. Captura: débito em CAIXA_GATEWAY e crédito
        em RECEITA_TENANT. Estorno: débito em ESTORNOS e crédito em CAIXA_GATEWAY. O saldo é a
        receita líquida do tenant (créditos em RECEITA_TENANT menos débitos em ESTORNOS), em todas
        as páginas, na moeda pedida: valores de moedas diferentes nunca são somados. Os itens
        trazem lançamentos de todas as moedas.
      parameters:
        - name: moeda
          in: query
          required: false
          description: Moeda (ISO 4217) do saldo. Padrão BRL.
          schema: { type: string, pattern: '^[A-Z]{3}$', default: BRL }
        - $ref: '_comum.yaml#/components/parameters/Cursor'
        - $ref: '_comum.yaml#/components/parameters/Limite'
      responses:
        '200':
          description: Página de lançamentos e saldo derivado.
          content:
            application/json:
              schema:
                type: object
                required: [itens, saldo]
                properties:
                  itens:
                    type: array
                    items: { $ref: '#/components/schemas/Lancamento' }
                  saldo: { $ref: '_comum.yaml#/components/schemas/Dinheiro' }
                  proximoCursor: { type: [string, 'null'] }
        '400': { $ref: '_comum.yaml#/components/responses/RequisicaoInvalida' }
        '403': { $ref: '#/components/responses/SemPermissao' }
components:
  securitySchemes:
    jwt:
      $ref: '_comum.yaml#/components/securitySchemes/jwt'
  responses:
    SemPermissao:
      description: O papel do usuário não permite a operação.
      content:
        application/problem+json:
          schema: { $ref: '_comum.yaml#/components/schemas/Problema' }
  schemas:
    StatusPagamento:
      type: string
      enum: [AUTORIZANDO, APROVADO, RECUSADO, ESTORNADO]
    Pagamento:
      type: object
      required: [id, pedidoId, status, valor, criadoEm]
      properties:
        id: { type: string }
        pedidoId: { type: string }
        status: { $ref: '#/components/schemas/StatusPagamento' }
        valor: { $ref: '_comum.yaml#/components/schemas/Dinheiro' }
        clienteId: { type: string, description: Cliente B2B dono do pedido. }
        motivoRecusa: { type: [string, 'null'] }
        criadoEm: { type: string, format: date-time }
        atualizadoEm: { type: string, format: date-time }
    Lancamento:
      type: object
      description: Uma partida do ledger. Todo movimento gera um débito e um crédito de mesmo valor.
      required: [id, pagamentoId, conta, natureza, valor, ocorridoEm]
      properties:
        id: { type: string }
        pagamentoId: { type: string }
        pedidoId: { type: string }
        conta:
          type: string
          enum: [CAIXA_GATEWAY, RECEITA_TENANT, ESTORNOS]
        natureza:
          type: string
          enum: [DEBITO, CREDITO]
        valor: { $ref: '_comum.yaml#/components/schemas/Dinheiro' }
        ocorridoEm: { type: string, format: date-time }

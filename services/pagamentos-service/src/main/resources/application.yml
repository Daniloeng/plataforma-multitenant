server:
  port: 8084
  shutdown: graceful

spring:
  application:
    name: pagamentos-service
  threads:
    virtual:
      enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    mongodb:
      # Replica set de um nó: transações (pagamento + ledger + outbox, efeito + deduplicação).
      uri: ${MONGO_URI:mongodb://localhost:27020/pagamentos?directConnection=true}
  pulsar:
    client:
      service-url: ${PULSAR_URL:pulsar://localhost:6650}
    admin:
      # O consumidor busca o schema do escritor de cada evento pelo admin (EventDecoder).
      service-url: ${PULSAR_ADMIN_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  # Observabilidade (ADR-0015): /actuator/prometheus, histograma de latência para o p99 e traces
  # OTLP (ligados com TRACING_EXPORT=true, como no perfil observabilidade do Compose).
  metrics:
    distribution:
      # Baldes fixos em vez do histograma padrão (~70 baldes): o limite da meta (3 s) é exato e as
      # séries cabem com a tag tenant (conta no ADR-0015).
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,3s,5s,10s
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${TRACING_EXPORT:false}
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,mongo

plataforma:
  # Contexto produtor (x-produtor) e prefixo das assinaturas: pagamentos-pedido-criado, ...
  service: pagamentos
  pagamentos:
    # Gateway de pagamento simulado: aprova até este valor (R$ 10.000,00) e recusa acima dele.
    limite-aprovacao-centavos: 1000000

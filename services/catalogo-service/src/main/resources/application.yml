server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: catalogo-service
  threads:
    virtual:
      enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    mongodb:
      # Replica set de um nó: transações (estado + outbox, efeito + deduplicação).
      uri: ${MONGO_URI:mongodb://localhost:27018/catalogo?directConnection=true}
  pulsar:
    client:
      service-url: ${PULSAR_URL:pulsar://localhost:6650}
    admin:
      # O consumidor busca o schema do escritor de cada evento pelo admin (EventDecoder).
      service-url: ${PULSAR_ADMIN_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  # Observabilidade (ADR-0015): /actuator/prometheus, histograma de latência para o p99 e traces
  # OTLP (ligados com TRACING_EXPORT=true, como no perfil observabilidade do Compose).
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${TRACING_EXPORT:false}
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,mongo

plataforma:
  # Contexto produtor (x-produtor) e prefixo das assinaturas: catalogo-tenant-criado, ...
  service: catalogo
  catalogo:
    limites:
      GRATUITO: 20
      PROFISSIONAL: 500
      EMPRESARIAL: 10000

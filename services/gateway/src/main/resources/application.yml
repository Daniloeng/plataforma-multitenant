server:
  port: 8000
  shutdown: graceful

spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  pulsar:
    client:
      service-url: ${PULSAR_URL:pulsar://localhost:6650}
    admin:
      service-url: ${PULSAR_ADMIN_URL:http://localhost:8080}

management:
  # Actuator numa porta só interna: a 8000 é pública e as métricas têm nomes de tenants.
  server:
    port: ${MANAGEMENT_PORT:8001}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  # Observabilidade (ADR-0015): /actuator/prometheus, histograma de latência para o p99 e traces
  # OTLP (ligados com TRACING_EXPORT=true, como no perfil observabilidade do Compose).
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${TRACING_EXPORT:false}
  endpoint:
    health:
      probes:
        enabled: true

plataforma:
  gateway:
    # CORS do frontend em desenvolvimento (Vite) e no preview; vale para todas as respostas.
    cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}
    # O navegador obtém o token em localhost:8180; o gateway busca as chaves pelo endereço interno.
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/plataforma}
    jwk-set-uri: ${KEYCLOAK_JWKS:http://localhost:8180/realms/plataforma/protocol/openid-connect/certs}
    services:
      tenants: ${TENANT_SERVICE_URL:http://localhost:8081}
      status: ${STATUS_SERVICE_URL:http://localhost:8090}
      catalogo: ${CATALOGO_SERVICE_URL:http://localhost:8082}
      pedidos: ${PEDIDOS_SERVICE_URL:http://localhost:8083}
      pagamentos: ${PAGAMENTOS_SERVICE_URL:http://localhost:8084}

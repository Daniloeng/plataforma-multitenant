server:
  port: 8000
  shutdown: graceful

spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  pulsar:
    client:
      service-url: ${PULSAR_URL:pulsar://localhost:6650}
    admin:
      service-url: ${PULSAR_ADMIN_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

plataforma:
  gateway:
    # CORS do frontend em desenvolvimento (Vite) e no preview; vale para todas as respostas.
    cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}
    # O navegador obtém o token em localhost:8180; o gateway busca as chaves pelo endereço interno.
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/plataforma}
    jwk-set-uri: ${KEYCLOAK_JWKS:http://localhost:8180/realms/plataforma/protocol/openid-connect/certs}
    services:
      tenants: ${TENANT_SERVICE_URL:http://localhost:8081}
      status: ${STATUS_SERVICE_URL:http://localhost:8090}
      catalogo: ${CATALOGO_SERVICE_URL:http://localhost:8082}

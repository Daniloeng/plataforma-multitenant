name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21, testes e cobertura ≥ 80%)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # verify = formatação (Spotless) + testes unitários e de integração (Testcontainers) + JaCoCo ≥ 80%
      - run: mvn -B verify
      - name: Resumo de cobertura
        if: always()
        run: |
          {
            echo "### Cobertura do backend (linhas)"
            echo "| Módulo | Linhas |"
            echo "|---|---|"
            for csv in $(find . -path '*/target/site/jacoco/jacoco.csv'); do
              mod=$(echo "$csv" | cut -d/ -f2-3)
              awk -F, -v m="$mod" 'NR>1{miss+=$8; cov+=$9} END{if (miss+cov>0) printf "| %s | %.1f%% |\n", m, 100*cov/(miss+cov)}' "$csv"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-backend
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore

  frontend:
    name: Frontend (Vitest, cobertura ≥ 80% e build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Resumo de cobertura
        if: always()
        run: |
          node -e '
            const s = require("./coverage/coverage-summary.json").total;
            const l = ["### Cobertura do frontend", "| Métrica | % |", "|---|---|"];
            for (const k of ["lines", "statements", "functions", "branches"]) l.push(`| ${k} | ${s[k].pct}% |`);
            console.log(l.join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
        env:
          VITE_DEMO: 'true'
          VITE_BASE: /plataforma-multitenant/

  compose:
    name: Ambiente local (Docker Compose sobe e /api/status responde UP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Subir MongoDB x4, Pulsar, Keycloak, gateway, serviços, status e observabilidade
        run: TRACING_EXPORT=true docker compose -f infra/docker-compose.yml --profile observabilidade up -d --build --wait --wait-timeout 420
      - name: Conferir /api/status pelo gateway
        run: |
          curl -fsS http://localhost:8000/api/status | tee status.json
          python3 - <<'PY'
          import json
          s = json.load(open("status.json"))
          assert s["status"] == "UP", s
          assert len(s["components"]) == 11, s
          assert s["runtime"]["platform"] == "compose", s["runtime"]
          print("\nPlataforma UP com", len(s["components"]), "componentes")
          PY
      - name: Conferir namespaces Pulsar
        run: |
          curl -fsS http://localhost:8080/admin/v2/namespaces/plataforma | tee ns.json
          for ns in tenants catalogo pedidos pagamentos; do
            grep -q "plataforma/$ns" ns.json
            test "$(curl -fsS http://localhost:8080/admin/v2/namespaces/plataforma/$ns/schemaCompatibilityStrategy)" = '"FULL"'
          done
      - name: Serviços não ficam expostos fora do gateway
        run: |
          for url in http://localhost:8081/api/v1/tenants http://localhost:8082/api/v1/produtos http://localhost:8083/api/v1/pedidos http://localhost:8084/api/v1/pagamentos http://localhost:8090/api/status; do
            if curl -fsS -m 3 "$url"; then echo "$url respondeu fora do gateway" && exit 1; fi
          done
      - name: Sem token, a API responde 401
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/me)" = 401
      - name: Criar tenants pelo gateway (seed) e conferir tenant.criado no Pulsar
        run: |
          infra/seed.sh
          topico=http://localhost:8080/admin/v2/persistent/plataforma/tenants/tenant.criado.v1
          for i in $(seq 1 30); do
            n=$(curl -fsS "$topico/stats" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("msgInCounter", 0))' || echo 0)
            [ "$n" -ge 3 ] && echo "tenant.criado publicado ($n mensagens)" && exit 0
            sleep 1
          done
          echo "tenant.criado não chegou ao Pulsar em 30 s" && exit 1
      - name: Identidade e tenant de ponta a ponta (Keycloak → gateway → serviços)
        run: |
          token() {
            curl -fsS http://localhost:8180/realms/plataforma/protocol/openid-connect/token \
              -d grant_type=password -d client_id=plataforma-cli -d "username=$1" -d password=senha123 |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])'
          }
          ANA=$(token ana)
          # O gateway aprende os tenants pelos eventos; espera acme e globex aparecerem para a ana.
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/v1/me -H "Authorization: Bearer $ANA" > me.json
            python3 -c 'import json; m=json.load(open("me.json")); exit(0 if len(m["tenants"]) == 2 else 1)' && break
            sleep 1
          done
          cat me.json
          python3 - <<'PY'
          import json
          m = json.load(open("me.json"))
          assert m["usuario"] == "ana" and m["papeis"] == ["gestor-tenant"], m
          assert sorted(t["id"] for t in m["tenants"]) == ["acme", "globex"], m
          PY
          # gestor-tenant não administra tenants; tenant alheio é recusado.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/tenants -H "Authorization: Bearer $ANA")" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/me -H "Authorization: Bearer $ANA" -H 'X-Tenant-Id: initech')" = 403
          # O limite do plano aparece nos cabeçalhos (globex é GRATUITO: 5 req/s).
          curl -fsS -D headers.txt -o /dev/null http://localhost:8000/api/v1/me -H "Authorization: Bearer $ANA" -H 'X-Tenant-Id: globex'
          grep -i '^x-ratelimit-limit: 5' headers.txt
      - name: Catálogo pelo gateway (produtos por tenant, papéis e limite do plano)
        run: |
          token() {
            curl -fsS http://localhost:8180/realms/plataforma/protocol/openid-connect/token \
              -d grant_type=password -d client_id=plataforma-cli -d "username=$1" -d password=senha123 |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])'
          }
          ANA=$(token ana); BRUNO=$(token bruno)
          api() { curl -sS -o resp.json -w '%{http_code}' "$@"; }
          # O seed criou produtos em acme; o catálogo aprende o plano de acme pelo tenant.criado
          # (consistência eventual: espera a cópia local chegar, até 30 s).
          for i in $(seq 1 30); do
            test "$(api http://localhost:8000/api/v1/produtos -H "Authorization: Bearer $BRUNO" -H 'X-Tenant-Id: acme')" = 200
            python3 -c 'import json,sys; sys.exit(json.load(open("resp.json"))["plano"] != "PROFISSIONAL")' && break
            sleep 1
          done
          cat resp.json
          python3 - <<'PY'
          import json
          p = json.load(open("resp.json"))
          assert p["total"] >= 3 and p["limitePlano"] == 500, p
          assert all(i["ativo"] for i in p["itens"]), p
          PY
          # Comprador não cadastra; gestor cadastra e o preco.alterado chega ao Pulsar.
          test "$(api -X POST http://localhost:8000/api/v1/produtos -H "Authorization: Bearer $BRUNO" -H 'X-Tenant-Id: acme' -H 'Content-Type: application/json' -d '{"sku":"CI-1","nome":"Item do CI","preco":{"centavos":990}}')" = 403
          test "$(api -X POST http://localhost:8000/api/v1/produtos -H "Authorization: Bearer $ANA" -H 'X-Tenant-Id: acme' -H 'Content-Type: application/json' -d '{"sku":"CI-1","nome":"Item do CI","preco":{"centavos":990}}')" = 201
          # globex é de outro tenant: o produto de acme não aparece lá.
          test "$(api 'http://localhost:8000/api/v1/produtos?busca=CI-1' -H "Authorization: Bearer $ANA" -H 'X-Tenant-Id: globex')" = 200
          python3 -c 'import json; p=json.load(open("resp.json")); assert p["total"] == 0, p'
          topico=http://localhost:8080/admin/v2/persistent/plataforma/catalogo/preco.alterado.v1
          for i in $(seq 1 30); do
            n=$(curl -fsS "$topico/stats" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("msgInCounter", 0))' || echo 0)
            [ "$n" -ge 4 ] && echo "preco.alterado publicado ($n mensagens)" && exit 0
            sleep 1
          done
          echo "preco.alterado não chegou ao Pulsar" && exit 1
      - name: Pedidos pelo gateway (preço do catálogo, idempotência e papéis)
        run: |
          token() {
            curl -fsS http://localhost:8180/realms/plataforma/protocol/openid-connect/token \
              -d grant_type=password -d client_id=plataforma-cli -d "username=$1" -d password=senha123 |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])'
          }
          ANA=$(token ana); BRUNO=$(token bruno)
          api() { curl -sS -o resp.json -w '%{http_code}' "$@"; }
          # Produto do seed em acme; o pedidos-service aprende nome e preço pelos eventos do catálogo.
          test "$(api 'http://localhost:8000/api/v1/produtos?busca=FITA-ISO' -H "Authorization: Bearer $BRUNO" -H 'X-Tenant-Id: acme')" = 200
          produto=$(python3 -c 'import json; print(json.load(open("resp.json"))["itens"][0]["id"])')
          corpo="{\"itens\":[{\"produtoId\":\"$produto\",\"quantidade\":3,\"precoUnitario\":{\"centavos\":1}}]}"
          chave=$(python3 -c 'import uuid; print(uuid.uuid4())')
          pedir() { api -X POST http://localhost:8000/api/v1/pedidos -H "Authorization: Bearer $1" -H 'X-Tenant-Id: acme' -H "Idempotency-Key: $2" -H 'Content-Type: application/json' -d "$3"; }
          # Consistência eventual: espera a cópia local do produto chegar (até 30 s).
          for i in $(seq 1 30); do
            code=$(pedir "$BRUNO" "$chave" "$corpo")
            [ "$code" = 201 ] && break
            # Só o produto ainda não copiado justifica esperar; qualquer outro erro falha já.
            [ "$code" = 409 ] && grep -q 'produto-indisponivel' resp.json || { cat resp.json; exit 1; }
            sleep 1
          done
          cat resp.json
          python3 - <<'PY'
          import json
          p = json.load(open("resp.json"))
          # O preço enviado pelo cliente é ignorado: vale o do catálogo (790 centavos).
          assert p["status"] == "PENDENTE" and p["total"]["centavos"] == 3 * 790, p
          assert p["clienteId"] == "cli-bruno", p
          PY
          id=$(python3 -c 'import json; print(json.load(open("resp.json"))["id"])')
          # Repetir com a mesma chave devolve o mesmo pedido; outro corpo com a mesma chave é 409.
          test "$(pedir "$BRUNO" "$chave" "$corpo")" = 200
          python3 -c "import json; assert json.load(open('resp.json'))['id'] == '$id'"
          test "$(pedir "$BRUNO" "$chave" "{\"itens\":[{\"produtoId\":\"$produto\",\"quantidade\":1}]}")" = 409
          # Gestora não compra, mas vê e cancela os pedidos do tenant.
          test "$(pedir "$ANA" "$(python3 -c 'import uuid; print(uuid.uuid4())')" "$corpo")" = 403
          test "$(api http://localhost:8000/api/v1/pedidos -H "Authorization: Bearer $ANA" -H 'X-Tenant-Id: acme')" = 200
          python3 -c "import json; assert '$id' in [p['id'] for p in json.load(open('resp.json'))['itens']]"
          test "$(api -X POST http://localhost:8000/api/v1/pedidos/$id/cancelamento -H "Authorization: Bearer $ANA" -H 'X-Tenant-Id: acme')" = 200
          test "$(api -X POST http://localhost:8000/api/v1/pedidos/$id/cancelamento -H "Authorization: Bearer $BRUNO" -H 'X-Tenant-Id: acme')" = 409
          for evento in pedido.criado pedido.cancelado; do
            topico=http://localhost:8080/admin/v2/persistent/plataforma/pedidos/$evento.v1
            ok=0
            for i in $(seq 1 30); do
              n=$(curl -fsS "$topico/stats" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("msgInCounter", 0))' || echo 0)
              [ "$n" -ge 1 ] && echo "$evento publicado ($n mensagens)" && ok=1 && break
              sleep 1
            done
            [ "$ok" = 1 ] || { echo "$evento não chegou ao Pulsar"; exit 1; }
          done
      - name: Saga de pagamento pelo gateway (aprova, recusa acima do limite e estorna)
        run: |
          token() {
            curl -fsS http://localhost:8180/realms/plataforma/protocol/openid-connect/token \
              -d grant_type=password -d client_id=plataforma-cli -d "username=$1" -d password=senha123 |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])'
          }
          ANA=$(token ana); BRUNO=$(token bruno)
          api() { curl -sS -o resp.json -w '%{http_code}' "$@"; }
          campo() { python3 -c "import json,sys; d=json.load(open('resp.json')); print(eval(sys.argv[1]))" "$1"; }
          produto() {
            test "$(api "http://localhost:8000/api/v1/produtos?busca=$1" -H "Authorization: Bearer $BRUNO" -H 'X-Tenant-Id: acme')" = 200
            campo 'd["itens"][0]["id"]'
          }
          pedir() {
            test "$(api -X POST http://localhost:8000/api/v1/pedidos -H "Authorization: Bearer $BRUNO" -H 'X-Tenant-Id: acme' \
              -H "Idempotency-Key: $(python3 -c 'import uuid; print(uuid.uuid4())')" -H 'Content-Type: application/json' \
              -d "{\"itens\":[{\"produtoId\":\"$1\",\"quantidade\":$2}]}")" = 201
            campo 'd["id"]'
          }
          # Espera o pedido sair de PENDENTE (o pagamento é assíncrono) e confere o estado final.
          esperar_pedido() {
            for i in $(seq 1 30); do
              test "$(api http://localhost:8000/api/v1/pedidos/$1 -H "Authorization: Bearer $BRUNO" -H 'X-Tenant-Id: acme')" = 200
              [ "$(campo 'd["status"]')" = "$2" ] && cat resp.json && echo && return 0
              sleep 1
            done
            cat resp.json; echo "pedido $1 não chegou a $2"; return 1
          }
          pagamento() {
            for i in $(seq 1 30); do
              test "$(api "http://localhost:8000/api/v1/pagamentos?pedidoId=$1" -H "Authorization: Bearer $ANA" -H 'X-Tenant-Id: acme')" = 200
              [ "$(campo 'd["itens"][0]["status"] if d["itens"] else ""')" = "$2" ] && return 0
              sleep 1
            done
            cat resp.json; echo "pagamento do pedido $1 não chegou a $2"; return 1
          }
          # Até R$ 10.000,00 o gateway simulado aprova: o pedido é confirmado e a receita entra no ledger.
          pago=$(pedir "$(produto FITA-ISO)" 2)
          # A linha do tempo (SSE) passa pelo gateway e mostra a confirmação chegar.
          curl -sS -N --max-time 60 "http://localhost:8000/api/v1/pedidos/$pago/linha-do-tempo" \
            -H "Authorization: Bearer $BRUNO" -H 'X-Tenant-Id: acme' -H 'Accept: text/event-stream' > sse.txt &
          SSE=$!
          esperar_pedido "$pago" CONFIRMADO
          for i in $(seq 1 20); do grep -q '"status":"CONFIRMADO"' sse.txt && break; sleep 0.5; done
          kill $SSE 2>/dev/null || true
          cat sse.txt
          grep -q '^event:pedido' sse.txt
          grep -q '"status":"CONFIRMADO"' sse.txt
          pagamento "$pago" APROVADO
          test "$(api http://localhost:8000/api/v1/ledger/lancamentos -H "Authorization: Bearer $ANA" -H 'X-Tenant-Id: acme')" = 200
          cat resp.json; echo
          python3 -c 'import json; d=json.load(open("resp.json")); assert d["saldo"]["centavos"] >= 1580, d'
          # Comprador não vê o financeiro.
          test "$(api http://localhost:8000/api/v1/pagamentos -H "Authorization: Bearer $BRUNO" -H 'X-Tenant-Id: acme')" = 403
          # Cancelar o pedido pago gera o estorno.
          test "$(api -X POST http://localhost:8000/api/v1/pedidos/$pago/cancelamento -H "Authorization: Bearer $BRUNO" -H 'X-Tenant-Id: acme')" = 200
          pagamento "$pago" ESTORNADO
          # O pedidos-service anota o estorno na linha do tempo do pedido.
          for i in $(seq 1 30); do
            test "$(api http://localhost:8000/api/v1/pedidos/$pago -H "Authorization: Bearer $BRUNO" -H 'X-Tenant-Id: acme')" = 200
            python3 -c 'import json; d=json.load(open("resp.json")); exit(0 if "ESTORNADO" in [m["tipo"] for m in d["historico"]] else 1)' && break
            sleep 1
          done
          python3 -c 'import json; d=json.load(open("resp.json")); t=[m["tipo"] for m in d["historico"]]; assert t == ["CRIADO","PAGO","CANCELADO","ESTORNADO"], t'
          # Acima do limite o pagamento é recusado e o pedido cancelado com PAGAMENTO_RECUSADO.
          caro=$(pedir "$(produto LUVA-NIT)" 2000)
          esperar_pedido "$caro" CANCELADO
          [ "$(campo 'd["motivoCancelamento"]')" = PAGAMENTO_RECUSADO ]
          pagamento "$caro" RECUSADO
      - name: Promoção de nível pelo gateway (POOL → BRIDGE, database e namespace próprios)
        run: |
          token() {
            curl -fsS http://localhost:8180/realms/plataforma/protocol/openid-connect/token \
              -d grant_type=password -d client_id=plataforma-cli -d "username=$1" -d password=senha123 |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])'
          }
          ADMIN=$(token admin); ANA=$(token ana)
          api() { curl -sS -o resp.json -w '%{http_code}' "$@"; }
          promover() { api -X POST http://localhost:8000/api/v1/tenants/globex/promocao -H "Authorization: Bearer $1" -H 'Content-Type: application/json' -d "{\"nivelIsolamento\":\"$2\"}"; }
          contar() { # database coleção: documentos do globex
            docker compose -f infra/docker-compose.yml exec -T mongo-pedidos mongosh --quiet \
              --eval "db.getSiblingDB('$1').$2.countDocuments({tenantId: 'globex'})"
          }
          # Cópia local do catálogo do globex (o seed criou 2 produtos), ainda na database padrão.
          for i in $(seq 1 30); do [ "$(contar pedidos produtos)" -ge 2 ] && break; sleep 1; done
          antes=$(contar pedidos produtos); echo "produtos do globex antes: $antes"
          [ "$antes" -ge 2 ]
          # Só o admin promove; repetir o nível é 409 nivel-invalido.
          test "$(promover "$ANA" BRIDGE)" = 403
          test "$(promover "$ADMIN" BRIDGE)" = 200
          test "$(promover "$ADMIN" BRIDGE)" = 409
          grep -q nivel-invalido resp.json
          # O pedidos-service migra os dados do globex para a database dedicada.
          for i in $(seq 1 30); do
            test "$(api http://localhost:8000/api/v1/isolamento/pedidos -H "Authorization: Bearer $ANA" -H 'X-Tenant-Id: globex')" = 200
            python3 -c 'import json; d=json.load(open("resp.json")); exit(0 if d["situacao"] == "PRONTO" and d["database"] == "pedidos_t_globex" else 1)' && break
            sleep 1
          done
          cat resp.json; echo
          python3 -c 'import json; d=json.load(open("resp.json")); assert d["nivel"] == "BRIDGE" and d["situacao"] == "PRONTO" and d["database"] == "pedidos_t_globex", d'
          docker compose -f infra/docker-compose.yml exec -T mongo-pedidos mongosh --quiet --eval 'db.getMongo().getDBNames().join(" ")' | tee dbs.txt
          grep -qw pedidos_t_globex dbs.txt
          # Nada se perdeu nem ficou para trás: tudo do globex está só na database dedicada.
          test "$(contar pedidos_t_globex produtos)" = "$antes"
          test "$(contar pedidos produtos)" = 0
          test "$(contar pedidos tenants)" = 0
          # As APIs do tenant seguem funcionando, agora na database dedicada; acme fica no POOL.
          test "$(api http://localhost:8000/api/v1/pedidos -H "Authorization: Bearer $ANA" -H 'X-Tenant-Id: globex')" = 200
          test "$(api http://localhost:8000/api/v1/isolamento/pedidos -H "Authorization: Bearer $ANA" -H 'X-Tenant-Id: acme')" = 200
          python3 -c 'import json; d=json.load(open("resp.json")); assert d["nivel"] == "POOL" and d["database"] == "pedidos", d'
          # Namespace Pulsar próprio, com retenção e cota pelo plano.
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/admin/v2/namespaces/plataforma | grep -q 'plataforma/t-globex' && break
            sleep 1
          done
          curl -fsS http://localhost:8080/admin/v2/namespaces/plataforma/t-globex/retention | tee retencao.json; echo
          python3 -c 'import json; assert json.load(open("retencao.json"))["retentionTimeInMinutes"] == 1440'
          # O gateway aprende o nível novo pelo tenant.alterado e mostra no /me.
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/v1/me -H "Authorization: Bearer $ANA" > me.json
            python3 -c 'import json; m=json.load(open("me.json")); exit(0 if {t["id"]: t["nivelIsolamento"] for t in m["tenants"]}["globex"] == "BRIDGE" else 1)' && break
            sleep 1
          done
          python3 -c 'import json; m=json.load(open("me.json")); assert {t["id"]: t["nivelIsolamento"] for t in m["tenants"]}["globex"] == "BRIDGE", m'
      - name: Observabilidade (alertas testados, métricas, Prometheus, Grafana e trace entre serviços)
        run: |
          # Regras de alerta: sintaxe e testes unitários (promtool).
          docker run --rm -v "$PWD/infra/observabilidade/prometheus:/p" -w /p --entrypoint promtool \
            prom/prometheus:v3.4.2 check config prometheus.yml
          docker run --rm -v "$PWD/infra/observabilidade/prometheus:/p" -w /p --entrypoint promtool \
            prom/prometheus:v3.4.2 test rules alertas.test.yml
          # A página de saúde traz as métricas de cada serviço (o pedidos-service já atendeu e consumiu).
          curl -fsS -o /dev/null http://localhost:8000/api/status # conta como requisição do gateway
          curl -fsS http://localhost:8000/api/status > status-metricas.json
          python3 - <<'PY'
          import json
          s = {c["name"]: c for c in json.load(open("status-metricas.json"))["components"]}
          m = s["pedidos-service"]["metrics"]
          assert m and m["requests"] > 0 and m["p99Ms"] is not None, m
          assert m["outboxPending"] is not None and m["eventsConsumed"] > 0, m
          assert s["gateway"]["metrics"]["requests"] > 0, s["gateway"]
          assert s["keycloak"].get("metrics") is None, s["keycloak"]
          print("Métricas do pedidos-service:", m)
          PY
          # As métricas do gateway não saem pela porta pública.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/actuator/prometheus)" -ge 400
          # Prometheus raspa os 5 serviços e cada serviço com outbox tem exatamente um líder do relay.
          q() { curl -fsS --get http://localhost:9090/api/v1/query --data-urlencode "query=$1"; }
          for i in $(seq 1 30); do
            q 'sum(up)' | python3 -c 'import json,sys; exit(0 if float(json.load(sys.stdin)["data"]["result"][0]["value"][1]) == 5 else 1)' && break
            sleep 2
          done
          q 'sum(up)' | python3 -c 'import json,sys; v=json.load(sys.stdin)["data"]["result"][0]["value"][1]; assert float(v) == 5, v'
          q 'sum by (job) (plataforma_outbox_relay_lider)' | python3 -c '
          import json, sys
          r = {x["metric"]["job"]: float(x["value"][1]) for x in json.load(sys.stdin)["data"]["result"]}
          assert set(r) == {"tenant-service", "catalogo-service", "pedidos-service", "pagamentos-service"}, r
          assert all(v == 1 for v in r.values()), r
          print("Líder do relay por serviço:", r)'
          q 'count(http_server_requests_seconds_count{tenant="acme"})' | python3 -c 'import json,sys; assert json.load(sys.stdin)["data"]["result"], "sem tag de tenant"'
          curl -fsS http://localhost:9090/api/v1/rules | python3 -c 'import json,sys; n=sum(len(g["rules"]) for g in json.load(sys.stdin)["data"]["groups"]); assert n == 10, n'
          # Grafana com o Prometheus e o painel provisionados.
          curl -fsS http://localhost:3000/api/health
          curl -fsS http://localhost:3000/api/dashboards/uid/plataforma | python3 -c 'import json,sys; d=json.load(sys.stdin)["dashboard"]; assert len(d["panels"]) >= 10; print("\nPainel:", d["title"])'
          # Um trace que atravessa o Pulsar: o consumo de pedido.criado no pagamentos-service tem
          # como pai o span do pedidos-service (traceparent gravado no outbox).
          for i in $(seq 1 30); do
            curl -fsS --get http://localhost:3200/api/search --data-urlencode 'q={ resource.service.name = "pagamentos-service" && name = "consumir pedido.criado" }' > traces.json || true
            python3 -c 'import json; exit(0 if json.load(open("traces.json")).get("traces") else 1)' && break
            sleep 2
          done
          TRACE=$(python3 -c 'import json; print(json.load(open("traces.json"))["traces"][0]["traceID"])')
          curl -fsS "http://localhost:3200/api/traces/$TRACE" > trace.json
          python3 - <<'PY'
          import json
          t = json.load(open("trace.json"))
          servicos = set()
          for b in t.get("batches", t.get("resourceSpans", [])):
              for a in b["resource"]["attributes"]:
                  if a["key"] == "service.name":
                      servicos.add(a["value"]["stringValue"])
          assert {"pedidos-service", "pagamentos-service"} <= servicos, servicos
          print("Trace", "atravessa", sorted(servicos))
          PY
      - name: Logs em caso de falha
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail 200
      - if: always()
        run: docker compose -f infra/docker-compose.yml --profile observabilidade down -v

  kubernetes:
    name: Kubernetes (kind, chart Helm, KEDA e lease do relay)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Cópias do chart iguais às do Compose
        run: |
          diff infra/pulsar/init.sh deploy/helm/plataforma/files/pulsar-init.sh
          diff infra/keycloak/realm-plataforma.json deploy/helm/plataforma/files/realm-plataforma.json
      - name: Lint e schemas (chart e Argo CD)
        run: |
          helm lint deploy/helm/plataforma -f deploy/helm/plataforma/values-kind.yaml --strict
          helm lint deploy/helm/plataforma -f deploy/helm/plataforma/values-homolog.yaml --strict
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          # CRDs (KEDA e Argo CD) pelo catálogo de schemas da comunidade.
          crds='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          for v in values-kind.yaml values-homolog.yaml; do
            helm template plataforma deploy/helm/plataforma -n plataforma -f deploy/helm/plataforma/$v |
              ./kubeconform -strict -summary -kubernetes-version 1.32.0 -schema-location default -schema-location "$crds" -
          done
          ./kubeconform -strict -summary -schema-location default -schema-location "$crds" deploy/argocd/*.yaml deploy/argocd/apps/*.yaml
      - name: Construir as imagens
        run: docker compose -f infra/docker-compose.yml build
      - uses: helm/kind-action@v1
        with:
          version: v0.27.0
          node_image: kindest/node:v1.32.2
          cluster_name: plataforma
      - name: Carregar as imagens no kind
        run: |
          for svc in gateway status-service tenant-service catalogo-service pedidos-service pagamentos-service; do
            kind load docker-image "plataforma/$svc:dev" --name plataforma
          done
      - name: Instalar o KEDA
        run: |
          helm repo add kedacore https://kedacore.github.io/charts
          helm install keda kedacore/keda --version 2.17.2 -n keda --create-namespace --wait --timeout 5m
      - name: Instalar a plataforma (helm install --wait)
        run: |
          helm install plataforma deploy/helm/plataforma -n plataforma --create-namespace \
            -f deploy/helm/plataforma/values-kind.yaml --wait --timeout 15m
          kubectl -n plataforma get pods -o wide
      - name: helm test (status UP pelo gateway, rodando no Kubernetes)
        run: helm test plataforma -n plataforma --logs --timeout 5m
      - name: Gateway e Keycloak no localhost (port-forward)
        run: |
          kubectl -n plataforma port-forward svc/gateway 8000:8000 > pf-gateway.log 2>&1 &
          kubectl -n plataforma port-forward svc/keycloak 8180:8080 > pf-keycloak.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/status > status.json 2>/dev/null && break; sleep 1; done
          python3 - <<'PY'
          import json
          s = json.load(open("status.json"))
          assert s["status"] == "UP", s
          assert len(s["components"]) == 11, s
          assert s["runtime"]["platform"] == "kubernetes" and s["runtime"]["namespace"] == "plataforma", s["runtime"]
          print("UP no Kubernetes:", s["runtime"])
          PY
          infra/seed.sh
      - name: Fronteira de rede (NetworkPolicy)
        run: |
          # De um pod qualquer do namespace, os serviços e o MongoDB não respondem; só o gateway.
          kubectl -n plataforma run intruso --image=curlimages/curl:8.11.1 --restart=Never --command -- sleep 300
          kubectl -n plataforma wait pod/intruso --for=condition=Ready --timeout 2m
          kubectl -n plataforma exec intruso -- curl -fsS -m 5 -o /dev/null http://gateway:8000/api/status
          if kubectl -n plataforma exec intruso -- curl -sS -m 5 -o /dev/null http://pedidos-service:8083/actuator/health; then
            echo "pedidos-service respondeu a um pod que não é o gateway"; exit 1
          fi
          if kubectl -n plataforma exec intruso -- curl -sS -m 5 -o /dev/null telnet://mongo-pedidos-0.mongo-pedidos:27017; then
            echo "mongo-pedidos aceitou conexão de um pod que não é o pedidos-service"; exit 1
          fi
          kubectl -n plataforma delete pod intruso --wait=false
      - name: Lease do relay com duas réplicas do pedidos-service
        run: |
          test "$(kubectl -n plataforma get pods -l app.kubernetes.io/name=pedidos-service --no-headers | wc -l)" = 2
          total=0; porta=18083
          for pod in $(kubectl -n plataforma get pods -l app.kubernetes.io/name=pedidos-service -o name); do
            kubectl -n plataforma port-forward "$pod" "$porta:8083" > /dev/null 2>&1 &
            pf=$!
            for i in $(seq 1 20); do curl -fsS "localhost:$porta/actuator/prometheus" > m.txt 2>/dev/null && break; sleep 1; done
            kill "$pf"
            v=$(awk '/^plataforma_outbox_relay_lider/ {print int($2)}' m.txt)
            echo "${pod#pod/}: líder=$v"
            total=$((total + v)); porta=$((porta + 1))
          done
          test "$total" = 1
      - name: KEDA escala o pagamentos-service pelo backlog do Pulsar
        run: |
          kubectl -n plataforma port-forward svc/pulsar 8080:8080 > pf-pulsar.log 2>&1 &
          kubectl -n plataforma wait scaledobject/pagamentos-service --for=condition=Ready --timeout 3m
          # Pausa o consumidor (0 réplicas) para acumular backlog de pedido.criado.
          kubectl -n plataforma annotate scaledobject/pagamentos-service autoscaling.keda.sh/paused-replicas=0 --overwrite
          kubectl -n plataforma wait deploy/pagamentos-service --for=jsonpath='{.spec.replicas}'=0 --timeout 2m
          kubectl -n plataforma wait pod -l app.kubernetes.io/name=pagamentos-service --for=delete --timeout 2m
          python3 - <<'PY'
          import json, time, urllib.request, urllib.parse, uuid
          def token(user):
              data = urllib.parse.urlencode({"grant_type": "password", "client_id": "plataforma-cli",
                                             "username": user, "password": "senha123"}).encode()
              with urllib.request.urlopen("http://localhost:8180/realms/plataforma/protocol/openid-connect/token", data) as r:
                  return json.load(r)["access_token"]
          bruno = token("bruno")
          def call(method, path, body=None, key=None):
              for _ in range(60):
                  req = urllib.request.Request("http://localhost:8000" + path, method=method,
                                               data=None if body is None else json.dumps(body).encode())
                  req.add_header("Authorization", "Bearer " + bruno)
                  req.add_header("X-Tenant-Id", "acme")
                  req.add_header("Content-Type", "application/json")
                  if key:
                      req.add_header("Idempotency-Key", key)
                  try:
                      with urllib.request.urlopen(req) as r:
                          return json.load(r)
                  except urllib.error.HTTPError as e:
                      corpo = e.read().decode()
                      if e.code == 429 or (e.code == 409 and "produto-indisponivel" in corpo):
                          time.sleep(1)  # limite do plano, ou cópia local do catálogo chegando
                          continue
                      raise SystemExit(f"{method} {path}: HTTP {e.code} {corpo}")
              raise SystemExit("limite de tentativas")
          produto = call("GET", "/api/v1/produtos?busca=FITA-ISO")["itens"][0]["id"]
          ids = [call("POST", "/api/v1/pedidos", {"itens": [{"produtoId": produto, "quantidade": 1}]},
                      str(uuid.uuid4()))["id"] for _ in range(600)]
          json.dump(ids, open("pedidos.json", "w"))
          print(len(ids), "pedidos PENDENTE com o pagamentos-service parado")
          PY
          backlog() {
            curl -fsS http://localhost:8080/admin/v2/persistent/plataforma/pedidos/pedido.criado.v1/stats |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["subscriptions"]["pagamentos-pedido-criado"]["msgBacklog"])'
          }
          # O relay publica em lotes: espera os 600 chegarem ao tópico.
          for i in $(seq 1 90); do b=$(backlog); [ "$b" -ge 600 ] && break; sleep 1; done
          echo "backlog antes: $b"
          test "$b" -ge 600
          # Volta o KEDA: backlog 600 e limite 20 por réplica pedem o máximo (3). O volume é grande
          # para a primeira réplica não esvaziar a fila antes de o HPA (sincroniza a cada 15 s) reagir.
          kubectl -n plataforma annotate scaledobject/pagamentos-service autoscaling.keda.sh/paused-replicas-
          max=0
          for i in $(seq 1 90); do
            for r in $(kubectl -n plataforma get hpa keda-hpa-pagamentos-service -o jsonpath='{.status.desiredReplicas}' 2>/dev/null) \
                     $(kubectl -n plataforma get deploy/pagamentos-service -o jsonpath='{.spec.replicas}'); do
              [ "${r:-0}" -gt "$max" ] && max=$r
            done
            [ "$max" -ge 2 ] && break
            sleep 2
          done
          echo "réplicas pedidas pelo KEDA: $max"
          kubectl -n plataforma get scaledobject,hpa
          test "$max" -ge 2
          # O backlog esvazia e os pedidos saem de PENDENTE (o gateway simulado aprova).
          for i in $(seq 1 120); do b=$(backlog); [ "$b" = 0 ] && break; sleep 2; done
          echo "backlog depois: $b"
          test "$b" = 0
          python3 - <<'PY'
          import json, time, urllib.request, urllib.parse
          data = urllib.parse.urlencode({"grant_type": "password", "client_id": "plataforma-cli",
                                         "username": "bruno", "password": "senha123"}).encode()
          with urllib.request.urlopen("http://localhost:8180/realms/plataforma/protocol/openid-connect/token", data) as r:
              bruno = json.load(r)["access_token"]
          ids = json.load(open("pedidos.json"))
          for pid in ids[:: len(ids) // 6]:
              for _ in range(30):
                  req = urllib.request.Request(f"http://localhost:8000/api/v1/pedidos/{pid}")
                  req.add_header("Authorization", "Bearer " + bruno)
                  req.add_header("X-Tenant-Id", "acme")
                  try:
                      with urllib.request.urlopen(req) as r:
                          status = json.load(r)["status"]
                  except urllib.error.HTTPError as e:
                      if e.code != 429:
                          raise
                      status = "?"
                  if status == "CONFIRMADO":
                      break
                  time.sleep(1)
              assert status == "CONFIRMADO", (pid, status)
          print("pedidos confirmados depois da escala")
          PY
      - name: Diagnóstico em caso de falha
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n plataforma get events --sort-by=.lastTimestamp | tail -60
          for d in gateway status-service tenant-service catalogo-service pedidos-service pagamentos-service keycloak; do
            echo "== $d"; kubectl -n plataforma logs deploy/$d --all-containers --tail 80 || true
          done
          kubectl -n plataforma logs statefulset/pulsar --tail 80 || true
          kubectl -n plataforma get networkpolicy,hpa,scaledobject || true
          kubectl -n keda logs deploy/keda-operator --tail 80 || true

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21, testes e cobertura ≥ 80%)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # verify = formatação (Spotless) + testes unitários e de integração (Testcontainers) + JaCoCo ≥ 80%
      - run: mvn -B verify
      - name: Resumo de cobertura
        if: always()
        run: |
          {
            echo "### Cobertura do backend (linhas)"
            echo "| Módulo | Linhas |"
            echo "|---|---|"
            for csv in $(find . -path '*/target/site/jacoco/jacoco.csv'); do
              mod=$(echo "$csv" | cut -d/ -f2-3)
              awk -F, -v m="$mod" 'NR>1{miss+=$8; cov+=$9} END{if (miss+cov>0) printf "| %s | %.1f%% |\n", m, 100*cov/(miss+cov)}' "$csv"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-backend
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore

  frontend:
    name: Frontend (Vitest, cobertura ≥ 80% e build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Resumo de cobertura
        if: always()
        run: |
          node -e '
            const s = require("./coverage/coverage-summary.json").total;
            const l = ["### Cobertura do frontend", "| Métrica | % |", "|---|---|"];
            for (const k of ["lines", "statements", "functions", "branches"]) l.push(`| ${k} | ${s[k].pct}% |`);
            console.log(l.join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
        env:
          VITE_DEMO: 'true'
          VITE_BASE: /plataforma-multitenant/

  compose:
    name: Ambiente local (Docker Compose sobe e /api/status responde UP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Subir MongoDB x4, Pulsar, Keycloak, gateway, tenant, catálogo, pedidos, pagamentos e status
        run: docker compose -f infra/docker-compose.yml up -d --build --wait --wait-timeout 420
      - name: Conferir /api/status pelo gateway
        run: |
          curl -fsS http://localhost:8000/api/status | tee status.json
          python3 - <<'PY'
          import json
          s = json.load(open("status.json"))
          assert s["status"] == "UP", s
          assert len(s["components"]) == 11, s
          print("\nPlataforma UP com", len(s["components"]), "componentes")
          PY
      - name: Conferir namespaces Pulsar
        run: |
          curl -fsS http://localhost:8080/admin/v2/namespaces/plataforma | tee ns.json
          for ns in tenants catalogo pedidos pagamentos; do
            grep -q "plataforma/$ns" ns.json
            test "$(curl -fsS http://localhost:8080/admin/v2/namespaces/plataforma/$ns/schemaCompatibilityStrategy)" = '"FULL"'
          done
      - name: Serviços não ficam expostos fora do gateway
        run: |
          for url in http://localhost:8081/api/v1/tenants http://localhost:8082/api/v1/produtos http://localhost:8083/api/v1/pedidos http://localhost:8084/api/v1/pagamentos http://localhost:8090/api/status; do
            if curl -fsS -m 3 "$url"; then echo "$url respondeu fora do gateway" && exit 1; fi
          done
      - name: Sem token, a API responde 401
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/me)" = 401
      - name: Criar tenants pelo gateway (seed) e conferir tenant.criado no Pulsar
        run: |
          infra/seed.sh
          topico=http://localhost:8080/admin/v2/persistent/plataforma/tenants/tenant.criado.v1
          for i in $(seq 1 30); do
            n=$(curl -fsS "$topico/stats" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("msgInCounter", 0))' || echo 0)
            [ "$n" -ge 3 ] && echo "tenant.criado publicado ($n mensagens)" && exit 0
            sleep 1
          done
          echo "tenant.criado não chegou ao Pulsar em 30 s" && exit 1
      - name: Identidade e tenant de ponta a ponta (Keycloak → gateway → serviços)
        run: |
          token() {
            curl -fsS http://localhost:8180/realms/plataforma/protocol/openid-connect/token \
              -d grant_type=password -d client_id=plataforma-cli -d "username=$1" -d password=senha123 |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])'
          }
          ANA=$(token ana)
          # O gateway aprende os tenants pelos eventos; espera acme e globex aparecerem para a ana.
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/v1/me -H "Authorization: Bearer $ANA" > me.json
            python3 -c 'import json; m=json.load(open("me.json")); exit(0 if len(m["tenants"]) == 2 else 1)' && break
            sleep 1
          done
          cat me.json
          python3 - <<'PY'
          import json
          m = json.load(open("me.json"))
          assert m["usuario"] == "ana" and m["papeis"] == ["gestor-tenant"], m
          assert sorted(t["id"] for t in m["tenants"]) == ["acme", "globex"], m
          PY
          # gestor-tenant não administra tenants; tenant alheio é recusado.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/tenants -H "Authorization: Bearer $ANA")" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/me -H "Authorization: Bearer $ANA" -H 'X-Tenant-Id: initech')" = 403
          # O limite do plano aparece nos cabeçalhos (globex é GRATUITO: 5 req/s).
          curl -fsS -D headers.txt -o /dev/null http://localhost:8000/api/v1/me -H "Authorization: Bearer $ANA" -H 'X-Tenant-Id: globex'
          grep -i '^x-ratelimit-limit: 5' headers.txt
      - name: Catálogo pelo gateway (produtos por tenant, papéis e limite do plano)
        run: |
          token() {
            curl -fsS http://localhost:8180/realms/plataforma/protocol/openid-connect/token \
              -d grant_type=password -d client_id=plataforma-cli -d "username=$1" -d password=senha123 |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])'
          }
          ANA=$(token ana); BRUNO=$(token bruno)
          api() { curl -sS -o resp.json -w '%{http_code}' "$@"; }
          # O seed criou produtos em acme; o catálogo aprende o plano de acme pelo tenant.criado
          # (consistência eventual: espera a cópia local chegar, até 30 s).
          for i in $(seq 1 30); do
            test "$(api http://localhost:8000/api/v1/produtos -H "Authorization: Bearer $BRUNO" -H 'X-Tenant-Id: acme')" = 200
            python3 -c 'import json,sys; sys.exit(json.load(open("resp.json"))["plano"] != "PROFISSIONAL")' && break
            sleep 1
          done
          cat resp.json
          python3 - <<'PY'
          import json
          p = json.load(open("resp.json"))
          assert p["total"] >= 3 and p["limitePlano"] == 500, p
          assert all(i["ativo"] for i in p["itens"]), p
          PY
          # Comprador não cadastra; gestor cadastra e o preco.alterado chega ao Pulsar.
          test "$(api -X POST http://localhost:8000/api/v1/produtos -H "Authorization: Bearer $BRUNO" -H 'X-Tenant-Id: acme' -H 'Content-Type: application/json' -d '{"sku":"CI-1","nome":"Item do CI","preco":{"centavos":990}}')" = 403
          test "$(api -X POST http://localhost:8000/api/v1/produtos -H "Authorization: Bearer $ANA" -H 'X-Tenant-Id: acme' -H 'Content-Type: application/json' -d '{"sku":"CI-1","nome":"Item do CI","preco":{"centavos":990}}')" = 201
          # globex é de outro tenant: o produto de acme não aparece lá.
          test "$(api 'http://localhost:8000/api/v1/produtos?busca=CI-1' -H "Authorization: Bearer $ANA" -H 'X-Tenant-Id: globex')" = 200
          python3 -c 'import json; p=json.load(open("resp.json")); assert p["total"] == 0, p'
          topico=http://localhost:8080/admin/v2/persistent/plataforma/catalogo/preco.alterado.v1
          for i in $(seq 1 30); do
            n=$(curl -fsS "$topico/stats" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("msgInCounter", 0))' || echo 0)
            [ "$n" -ge 4 ] && echo "preco.alterado publicado ($n mensagens)" && exit 0
            sleep 1
          done
          echo "preco.alterado não chegou ao Pulsar" && exit 1
      - name: Pedidos pelo gateway (preço do catálogo, idempotência e papéis)
        run: |
          token() {
            curl -fsS http://localhost:8180/realms/plataforma/protocol/openid-connect/token \
              -d grant_type=password -d client_id=plataforma-cli -d "username=$1" -d password=senha123 |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])'
          }
          ANA=$(token ana); BRUNO=$(token bruno)
          api() { curl -sS -o resp.json -w '%{http_code}' "$@"; }
          # Produto do seed em acme; o pedidos-service aprende nome e preço pelos eventos do catálogo.
          test "$(api 'http://localhost:8000/api/v1/produtos?busca=FITA-ISO' -H "Authorization: Bearer $BRUNO" -H 'X-Tenant-Id: acme')" = 200
          produto=$(python3 -c 'import json; print(json.load(open("resp.json"))["itens"][0]["id"])')
          corpo="{\"itens\":[{\"produtoId\":\"$produto\",\"quantidade\":3,\"precoUnitario\":{\"centavos\":1}}]}"
          chave=$(python3 -c 'import uuid; print(uuid.uuid4())')
          pedir() { api -X POST http://localhost:8000/api/v1/pedidos -H "Authorization: Bearer $1" -H 'X-Tenant-Id: acme' -H "Idempotency-Key: $2" -H 'Content-Type: application/json' -d "$3"; }
          # Consistência eventual: espera a cópia local do produto chegar (até 30 s).
          for i in $(seq 1 30); do
            code=$(pedir "$BRUNO" "$chave" "$corpo")
            [ "$code" = 201 ] && break
            # Só o produto ainda não copiado justifica esperar; qualquer outro erro falha já.
            [ "$code" = 409 ] && grep -q 'produto-indisponivel' resp.json || { cat resp.json; exit 1; }
            sleep 1
          done
          cat resp.json
          python3 - <<'PY'
          import json
          p = json.load(open("resp.json"))
          # O preço enviado pelo cliente é ignorado: vale o do catálogo (790 centavos).
          assert p["status"] == "PENDENTE" and p["total"]["centavos"] == 3 * 790, p
          assert p["clienteId"] == "cli-bruno", p
          PY
          id=$(python3 -c 'import json; print(json.load(open("resp.json"))["id"])')
          # Repetir com a mesma chave devolve o mesmo pedido; outro corpo com a mesma chave é 409.
          test "$(pedir "$BRUNO" "$chave" "$corpo")" = 200
          python3 -c "import json; assert json.load(open('resp.json'))['id'] == '$id'"
          test "$(pedir "$BRUNO" "$chave" "{\"itens\":[{\"produtoId\":\"$produto\",\"quantidade\":1}]}")" = 409
          # Gestora não compra, mas vê e cancela os pedidos do tenant.
          test "$(pedir "$ANA" "$(python3 -c 'import uuid; print(uuid.uuid4())')" "$corpo")" = 403
          test "$(api http://localhost:8000/api/v1/pedidos -H "Authorization: Bearer $ANA" -H 'X-Tenant-Id: acme')" = 200
          python3 -c "import json; assert '$id' in [p['id'] for p in json.load(open('resp.json'))['itens']]"
          test "$(api -X POST http://localhost:8000/api/v1/pedidos/$id/cancelamento -H "Authorization: Bearer $ANA" -H 'X-Tenant-Id: acme')" = 200
          test "$(api -X POST http://localhost:8000/api/v1/pedidos/$id/cancelamento -H "Authorization: Bearer $BRUNO" -H 'X-Tenant-Id: acme')" = 409
          for evento in pedido.criado pedido.cancelado; do
            topico=http://localhost:8080/admin/v2/persistent/plataforma/pedidos/$evento.v1
            ok=0
            for i in $(seq 1 30); do
              n=$(curl -fsS "$topico/stats" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("msgInCounter", 0))' || echo 0)
              [ "$n" -ge 1 ] && echo "$evento publicado ($n mensagens)" && ok=1 && break
              sleep 1
            done
            [ "$ok" = 1 ] || { echo "$evento não chegou ao Pulsar"; exit 1; }
          done
      - name: Saga de pagamento pelo gateway (aprova, recusa acima do limite e estorna)
        run: |
          token() {
            curl -fsS http://localhost:8180/realms/plataforma/protocol/openid-connect/token \
              -d grant_type=password -d client_id=plataforma-cli -d "username=$1" -d password=senha123 |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])'
          }
          ANA=$(token ana); BRUNO=$(token bruno)
          api() { curl -sS -o resp.json -w '%{http_code}' "$@"; }
          campo() { python3 -c "import json,sys; d=json.load(open('resp.json')); print(eval(sys.argv[1]))" "$1"; }
          produto() {
            test "$(api "http://localhost:8000/api/v1/produtos?busca=$1" -H "Authorization: Bearer $BRUNO" -H 'X-Tenant-Id: acme')" = 200
            campo 'd["itens"][0]["id"]'
          }
          pedir() {
            test "$(api -X POST http://localhost:8000/api/v1/pedidos -H "Authorization: Bearer $BRUNO" -H 'X-Tenant-Id: acme' \
              -H "Idempotency-Key: $(python3 -c 'import uuid; print(uuid.uuid4())')" -H 'Content-Type: application/json' \
              -d "{\"itens\":[{\"produtoId\":\"$1\",\"quantidade\":$2}]}")" = 201
            campo 'd["id"]'
          }
          # Espera o pedido sair de PENDENTE (o pagamento é assíncrono) e confere o estado final.
          esperar_pedido() {
            for i in $(seq 1 30); do
              test "$(api http://localhost:8000/api/v1/pedidos/$1 -H "Authorization: Bearer $BRUNO" -H 'X-Tenant-Id: acme')" = 200
              [ "$(campo 'd["status"]')" = "$2" ] && cat resp.json && echo && return 0
              sleep 1
            done
            cat resp.json; echo "pedido $1 não chegou a $2"; return 1
          }
          pagamento() {
            for i in $(seq 1 30); do
              test "$(api "http://localhost:8000/api/v1/pagamentos?pedidoId=$1" -H "Authorization: Bearer $ANA" -H 'X-Tenant-Id: acme')" = 200
              [ "$(campo 'd["itens"][0]["status"] if d["itens"] else ""')" = "$2" ] && return 0
              sleep 1
            done
            cat resp.json; echo "pagamento do pedido $1 não chegou a $2"; return 1
          }
          # Até R$ 10.000,00 o gateway simulado aprova: o pedido é confirmado e a receita entra no ledger.
          pago=$(pedir "$(produto FITA-ISO)" 2)
          esperar_pedido "$pago" CONFIRMADO
          pagamento "$pago" APROVADO
          test "$(api http://localhost:8000/api/v1/ledger/lancamentos -H "Authorization: Bearer $ANA" -H 'X-Tenant-Id: acme')" = 200
          cat resp.json; echo
          python3 -c 'import json; d=json.load(open("resp.json")); assert d["saldo"]["centavos"] >= 1580, d'
          # Comprador não vê o financeiro.
          test "$(api http://localhost:8000/api/v1/pagamentos -H "Authorization: Bearer $BRUNO" -H 'X-Tenant-Id: acme')" = 403
          # Cancelar o pedido pago gera o estorno.
          test "$(api -X POST http://localhost:8000/api/v1/pedidos/$pago/cancelamento -H "Authorization: Bearer $BRUNO" -H 'X-Tenant-Id: acme')" = 200
          pagamento "$pago" ESTORNADO
          # Acima do limite o pagamento é recusado e o pedido cancelado com PAGAMENTO_RECUSADO.
          caro=$(pedir "$(produto LUVA-NIT)" 2000)
          esperar_pedido "$caro" CANCELADO
          [ "$(campo 'd["motivoCancelamento"]')" = PAGAMENTO_RECUSADO ]
          pagamento "$caro" RECUSADO
      - name: Logs em caso de falha
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail 200
      - if: always()
        run: docker compose -f infra/docker-compose.yml down -v

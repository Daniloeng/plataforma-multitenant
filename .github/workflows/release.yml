name: Release

# Publica uma versão (ADR-0016): tag v<versão>, imagens no ghcr.io e o chart Helm empacotado na
# release do GitHub. Roda à mão depois do merge; a versão precisa ser o appVersion do chart, que é
# a tag das imagens que o Argo CD instala.
on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão sem o v (ex.: 0.1.0-mvp1); igual ao appVersion do chart"
        required: true
      sha:
        description: "Commit a publicar (padrão: o último da main)"
        required: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.versao }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSAO: ${{ inputs.versao }}
      REGISTRO: ghcr.io/daniloeng
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
      - name: Conferir a versão
        run: |
          case "$VERSAO" in
            *[!0-9A-Za-z.-]* | "" ) echo "Versão inválida: $VERSAO" >&2; exit 1 ;;
          esac
          app=$(sed -nE 's/^appVersion: "?([^"]+)"?$/\1/p' deploy/helm/plataforma/Chart.yaml)
          if [ "$app" != "$VERSAO" ]; then
            echo "O appVersion do chart é $app, não $VERSAO: as imagens não bateriam com o chart." >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSAO" >/dev/null; then
            echo "A tag v$VERSAO já existe." >&2
            exit 1
          fi
      - name: Conferir o commit (na main e com o CI verde)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha=$(git rev-parse HEAD)
          git fetch -q origin main
          git merge-base --is-ancestor "$sha" origin/main || { echo "$sha não está na main." >&2; exit 1; }
          # Todas as verificações do CI concluídas e verdes nesse commit.
          gh api "repos/${{ github.repository }}/commits/$sha/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions") | {name, conclusion}]' > checks.json
          python3 - <<'PY'
          import json
          checks = json.load(open("checks.json"))
          ci = [c for c in checks if c["name"].lower() not in ("release", "tag", "claude")]
          ruins = [c for c in ci if c["conclusion"] != "success"]
          assert ci and not ruins, f"CI não está verde neste commit: {ruins or 'nenhuma verificação'}"
          print("CI verde:", ", ".join(c["name"] for c in ci))
          PY
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir e publicar as imagens
        run: |
          for svc in gateway status-service tenant-service catalogo-service pedidos-service pagamentos-service; do
            dir=services/$svc
            img="$REGISTRO/plataforma-$svc:$VERSAO"
            # Tag de imagem é imutável: uma versão publicada não é sobrescrita por um novo run.
            if docker manifest inspect "$img" > /dev/null 2>&1; then
              echo "$img já existe; escolha outra versão." >&2
              exit 1
            fi
            docker build -f "$dir/Dockerfile" -t "$img" \
              --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              --label "org.opencontainers.image.version=$VERSAO" .
            docker push "$img"
            echo "- \`$img\`" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.17.3
      - name: Empacotar o chart
        run: helm package deploy/helm/plataforma --destination dist
      - name: Criar a tag e a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSAO" -m "v$VERSAO"
          git push origin "v$VERSAO"
          gh release create "v$VERSAO" dist/*.tgz --title "v$VERSAO" --generate-notes \
            --notes "Imagens em ghcr.io/daniloeng/plataforma-<serviço>:$VERSAO. Instalação: deploy/argocd/README.md."
          echo "Pacotes novos no ghcr.io nascem privados: torne-os públicos (Package settings) para o cluster baixar sem credencial." >> "$GITHUB_STEP_SUMMARY"

name: Claude

# Claude Code no GitHub: responde a "@claude" em issues e PRs. Só roda se o segredo
# ANTHROPIC_API_KEY existir no repositório (sem ele, o job termina avisando, sem custo) e só para
# quem tem acesso de escrita, já que o repositório é público. Ele lê texto de issues e PRs, que
# podem ser de terceiros: o que ele propõe passa por PR e revisão humana, como o resto.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: >-
      (
        contains(github.event.comment.body, '@claude') ||
        contains(github.event.issue.body, '@claude') ||
        contains(github.event.issue.title, '@claude')
      ) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association || github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Conferir o segredo
        id: chave
        env:
          CHAVE: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$CHAVE" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Sem o segredo ANTHROPIC_API_KEY: o Claude não roda neste repositório."
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.chave.outputs.ok == 'true'
        with:
          fetch-depth: 1
      # Fixada por SHA: tag móvel com acesso ao segredo seria uma porta para a cadeia de suprimentos.
      - uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1
        if: steps.chave.outputs.ok == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

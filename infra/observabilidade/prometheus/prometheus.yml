# Prometheus do perfil "observabilidade" do Compose (ADR-0015). Raspa o /actuator/prometheus de cada
# serviço pela rede interna e avalia os alertas de alertas.yml. A descoberta por DNS (registro A)
# acha todas as réplicas de um serviço, não uma por raspagem: os alertas do relay somam por réplica.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alertas.yml

scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["gateway"]
        type: A
        port: 8001
  - job_name: tenant-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["tenant-service"]
        type: A
        port: 8081
  - job_name: catalogo-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["catalogo-service"]
        type: A
        port: 8082
  - job_name: pedidos-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["pedidos-service"]
        type: A
        port: 8083
  - job_name: pagamentos-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["pagamentos-service"]
        type: A
        port: 8084

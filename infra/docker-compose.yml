# Ambiente local: um MongoDB por microsserviço, Pulsar standalone, Keycloak, gateway e serviços.
# Do host, as APIs só são acessíveis pelo gateway (http://localhost:8000); o Keycloak fica em
# http://localhost:8180 (console: admin/admin; usuários de demonstração: senha123).
#
#   docker compose -f infra/docker-compose.yml up -d --wait        # tudo
#   docker compose -f infra/docker-compose.yml up -d --wait pulsar # só o necessário
#
# Cada MongoDB roda como replica set de um nó (necessário para transações,
# usadas pelo outbox a partir do Dia 3) e com cache do WiredTiger limitado a 256 MB.
name: plataforma

# Cada nó tem replica set próprio (rs-<serviço>) e se anuncia pelo nome do serviço no Compose.
# Assim um cliente nunca é redirecionado para o banco de outro serviço. Do host, conecte com
# directConnection=true (ex.: mongodb://localhost:27018/?directConnection=true).
x-mongo: &mongo
  image: mongo:8.0
  command: ["bash", "-c", "exec docker-entrypoint.sh mongod --replSet \"$$RS_NAME\" --bind_ip_all --wiredTigerCacheSizeGB 0.25 --quiet"]
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: 512m
  healthcheck:
    # Inicia o replica set na primeira vez; depois só confirma que o nó é PRIMARY.
    test:
      - CMD-SHELL
      - >-
        mongosh --quiet --eval "try { rs.status().ok } catch (e) {
        rs.initiate({_id: '$$RS_NAME', members: [{_id: 0, host: '$$RS_HOST'}]}).ok };
        db.hello().isWritablePrimary || quit(1)"
    interval: 5s
    timeout: 10s
    retries: 20
    start_period: 5s

services:
  mongo-tenants:
    <<: *mongo
    ports: ["27017:27017"]
    volumes: ["mongo-tenants:/data/db"]
    environment: { RS_NAME: rs-tenants, RS_HOST: "mongo-tenants:27017" }

  mongo-catalogo:
    <<: *mongo
    ports: ["27018:27017"]
    volumes: ["mongo-catalogo:/data/db"]
    environment: { RS_NAME: rs-catalogo, RS_HOST: "mongo-catalogo:27017" }

  mongo-pedidos:
    <<: *mongo
    ports: ["27019:27017"]
    volumes: ["mongo-pedidos:/data/db"]
    environment: { RS_NAME: rs-pedidos, RS_HOST: "mongo-pedidos:27017" }

  mongo-pagamentos:
    <<: *mongo
    ports: ["27020:27017"]
    volumes: ["mongo-pagamentos:/data/db"]
    environment: { RS_NAME: rs-pagamentos, RS_HOST: "mongo-pagamentos:27017" }

  pulsar:
    image: apachepulsar/pulsar:4.0.7
    command: ["bin/pulsar", "standalone", "--no-functions-worker", "--no-stream-storage"]
    environment:
      PULSAR_MEM: "-Xms256m -Xmx512m -XX:MaxDirectMemorySize=256m"
    ports:
      - "6650:6650" # protocolo binário (produtores e consumidores)
      - "8080:8080" # admin HTTP
    volumes: ["pulsar-data:/pulsar/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bin/pulsar-admin", "brokers", "healthcheck"]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 20s

  # Cria o tenant Pulsar "plataforma" e um namespace por domínio. Roda uma vez e termina.
  pulsar-init:
    image: curlimages/curl:8.11.1
    depends_on:
      pulsar:
        condition: service_healthy
    volumes: ["./pulsar/init.sh:/init.sh:ro"]
    entrypoint: ["sh", "/init.sh"]
    environment:
      PULSAR_ADMIN_URL: http://pulsar:8080
    restart: "no"

  status-service:
    build:
      context: ..
      dockerfile: services/status-service/Dockerfile
    image: plataforma/status-service:dev
    environment:
      MONGO_TENANTS_URI: mongodb://mongo-tenants:27017/?directConnection=true
      MONGO_CATALOGO_URI: mongodb://mongo-catalogo:27017/?directConnection=true
      MONGO_PEDIDOS_URI: mongodb://mongo-pedidos:27017/?directConnection=true
      MONGO_PAGAMENTOS_URI: mongodb://mongo-pagamentos:27017/?directConnection=true
      PULSAR_ADMIN_URL: http://pulsar:8080
      TENANT_SERVICE_URL: http://tenant-service:8081
      CATALOGO_SERVICE_URL: http://catalogo-service:8082
      PEDIDOS_SERVICE_URL: http://pedidos-service:8083
      GATEWAY_URL: http://gateway:8000
      KEYCLOAK_MANAGEMENT_URL: http://keycloak:9000
    depends_on:
      mongo-tenants: { condition: service_healthy }
      mongo-catalogo: { condition: service_healthy }
      mongo-pedidos: { condition: service_healthy }
      mongo-pagamentos: { condition: service_healthy }
      pulsar: { condition: service_healthy }
      pulsar-init: { condition: service_completed_successfully }
    deploy:
      resources:
        limits:
          memory: 384m

  tenant-service:
    build:
      context: ..
      dockerfile: services/tenant-service/Dockerfile
    image: plataforma/tenant-service:dev
    environment:
      MONGO_URI: mongodb://mongo-tenants:27017/tenants?replicaSet=rs-tenants
      PULSAR_URL: pulsar://pulsar:6650
    depends_on:
      mongo-tenants: { condition: service_healthy }
      pulsar: { condition: service_healthy }
      pulsar-init: { condition: service_completed_successfully }
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  catalogo-service:
    build:
      context: ..
      dockerfile: services/catalogo-service/Dockerfile
    image: plataforma/catalogo-service:dev
    environment:
      MONGO_URI: mongodb://mongo-catalogo:27017/catalogo?replicaSet=rs-catalogo
      PULSAR_URL: pulsar://pulsar:6650
      PULSAR_ADMIN_URL: http://pulsar:8080
    depends_on:
      mongo-catalogo: { condition: service_healthy }
      pulsar: { condition: service_healthy }
      pulsar-init: { condition: service_completed_successfully }
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  pedidos-service:
    build:
      context: ..
      dockerfile: services/pedidos-service/Dockerfile
    image: plataforma/pedidos-service:dev
    environment:
      MONGO_URI: mongodb://mongo-pedidos:27017/pedidos?replicaSet=rs-pedidos
      PULSAR_URL: pulsar://pulsar:6650
      PULSAR_ADMIN_URL: http://pulsar:8080
    depends_on:
      mongo-pedidos: { condition: service_healthy }
      pulsar: { condition: service_healthy }
      pulsar-init: { condition: service_completed_successfully }
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  # Identidade: realm "plataforma" importado de keycloak/realm-plataforma.json (ADR-0009).
  # O emissor dos tokens é sempre http://localhost:8180, também para quem fala com o Keycloak
  # pela rede interna (o gateway baixa as chaves por http://keycloak:8080).
  keycloak:
    image: keycloak/keycloak:26.4.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=60"
    ports: ["8180:8080"]
    volumes: ["./keycloak/realm-plataforma.json:/opt/keycloak/data/import/realm.json:ro"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768m
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 &&
          grep -q UP <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Porta de entrada: valida o JWT, confere o tenant, aplica o limite do plano e roteia.
  gateway:
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    image: plataforma/gateway:dev
    ports: ["8000:8000"]
    environment:
      KEYCLOAK_ISSUER: http://localhost:8180/realms/plataforma
      KEYCLOAK_JWKS: http://keycloak:8080/realms/plataforma/protocol/openid-connect/certs
      TENANT_SERVICE_URL: http://tenant-service:8081
      STATUS_SERVICE_URL: http://status-service:8090
      CATALOGO_SERVICE_URL: http://catalogo-service:8082
      PEDIDOS_SERVICE_URL: http://pedidos-service:8083
      PULSAR_URL: pulsar://pulsar:6650
      PULSAR_ADMIN_URL: http://pulsar:8080
    depends_on:
      keycloak: { condition: service_healthy }
      pulsar: { condition: service_healthy }
      pulsar-init: { condition: service_completed_successfully }
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384m

volumes:
  mongo-tenants:
  mongo-catalogo:
  mongo-pedidos:
  mongo-pagamentos:
  pulsar-data:
